[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weightpress"
version = "0.1.0"
description = "Learned error-bounded lossy compression for model weights (GPU k-means + lossless integer coding)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "zstandard>=0.22",
]

[project.optional-dependencies]
gpu = ["torch>=2.7"]
safetensors = ["safetensors>=0.4"]

[project.scripts]
weightpress = "weightpress.cli:main"

[tool.setuptools.packages.find]
include = ["weightpress*"]
